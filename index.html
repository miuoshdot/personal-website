<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Miłosz Miśkiewicz is a student and developer creating thoughtful digital products. Explore his projects, experience, education, skills, and contact information."
    />
    <meta name="author" content="Miłosz Miśkiewicz" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#252525" />
    <meta property="og:type" content="profile" />
    <meta
      property="og:title"
      content="Miłosz Miśkiewicz — Student &amp; Developer"
    />
    <meta
      property="og:description"
      content="Miłosz Miśkiewicz is a student and developer creating thoughtful digital products. Explore his projects, experience, education, skills, and contact information."
    />
    <meta property="og:site_name" content="Miłosz Miśkiewicz" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Miłosz Miśkiewicz — Student &amp; Developer"
    />
    <meta
      name="twitter:description"
      content="Miłosz Miśkiewicz is a student and developer creating thoughtful digital products. Explore his projects, experience, education, skills, and contact information."
    />
    <title>Miłosz Miśkiewicz — Student &amp; Developer</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "mainEntity": {
          "@type": "Person",
          "name": "Miłosz Miśkiewicz",
          "description": "Student and developer creating thoughtful digital products."
        }
      }
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
    />
    <link rel="stylesheet" href="styles.css?v=19" />
    <script src="script.js?v=11" defer></script>
  </head>
  <body>
    <main class="notes-app" aria-label="Personal website presented as notes">
      <header class="toolbar">
        <div class="toolbar__group toolbar__group--leading">
          <div class="window-controls" role="group" aria-label="Window controls">
            <button
              class="window-control window-control--close"
              type="button"
              aria-label="Close window"
            >
              <svg aria-hidden="true" viewBox="0 0 12 12">
                <path d="m3.5 3.5 5 5m0-5-5 5"></path>
              </svg>
            </button>
            <button
              class="window-control window-control--minimize"
              type="button"
              aria-label="Minimize window"
            >
              <svg aria-hidden="true" viewBox="0 0 12 12">
                <path d="M3 6h6"></path>
              </svg>
            </button>
            <button
              class="window-control window-control--zoom"
              type="button"
              aria-label="Enter full screen"
            >
              <svg aria-hidden="true" viewBox="0 0 12 12">
                <path d="M3 5V3h2M9 7v2H7"></path>
              </svg>
            </button>
          </div>

          <button
            class="icon-button"
            id="sidebarToggle"
            type="button"
            aria-label="Hide sidebar"
            aria-controls="sidebar"
            aria-expanded="true"
            title="Show or hide sidebar"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <path d="M9 4v16"></path>
              <path d="m5.5 9 1.5 1.5L5.5 12"></path>
            </svg>
          </button>

          <button
            class="icon-button toolbar__view-button"
            id="listViewButton"
            type="button"
            aria-label="List view"
            aria-pressed="true"
            title="List view"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="5" cy="6" r="1"></circle>
              <circle cx="5" cy="12" r="1"></circle>
              <circle cx="5" cy="18" r="1"></circle>
              <path d="M9 6h11M9 12h11M9 18h11"></path>
            </svg>
          </button>

          <button
            class="icon-button toolbar__view-button"
            id="gridButton"
            type="button"
            aria-label="Gallery view"
            aria-pressed="false"
            title="Gallery view"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <rect x="4" y="4" width="6" height="6" rx="1"></rect>
              <rect x="14" y="4" width="6" height="6" rx="1"></rect>
              <rect x="4" y="14" width="6" height="6" rx="1"></rect>
              <rect x="14" y="14" width="6" height="6" rx="1"></rect>
            </svg>
          </button>

          <button
            class="icon-button toolbar__trash-button"
            id="trashButton"
            type="button"
            aria-label="Delete note"
            title="Delete note"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M4 7h16"></path>
              <path d="m9 3h6l1 4H8l1-4Z"></path>
              <path d="m6 7 1 14h10l1-14"></path>
              <path d="M10 11v6M14 11v6"></path>
            </svg>
          </button>

          <span class="toolbar__separator" aria-hidden="true"></span>

          <button
            class="icon-button"
            id="newNoteButton"
            type="button"
            aria-label="New note"
            title="New note"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M13 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path>
              <path d="m9 15 1-3 7.4-7.4a1.4 1.4 0 0 1 2 2L12 14l-3 1Z"></path>
              <path d="m16 6 2 2"></path>
            </svg>
          </button>
        </div>

        <div class="toolbar__group toolbar__group--trailing">
          <button
            class="icon-button"
            id="themeToggle"
            type="button"
            aria-label="Enable dark mode"
            title="Change theme"
          >
            <svg class="theme-icon theme-icon--sun" aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
            </svg>
            <svg class="theme-icon theme-icon--moon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M20 15.4A8.5 8.5 0 0 1 8.6 4a8.5 8.5 0 1 0 11.4 11.4Z"></path>
            </svg>
          </button>

          <button
            class="icon-button"
            id="shareButton"
            type="button"
            aria-label="Share website"
            title="Share"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 15V3"></path>
              <path d="m8 7 4-4 4 4"></path>
              <path d="M6 10H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1"></path>
            </svg>
          </button>

          <label class="search" for="searchInput">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-4-4"></path>
            </svg>
            <input
              id="searchInput"
              type="search"
              placeholder="Search"
              autocomplete="off"
              spellcheck="false"
            />
            <kbd id="searchShortcut" hidden></kbd>
          </label>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar" id="sidebar" aria-label="Page sections">
          <nav class="sidebar__nav" aria-label="Main navigation">
            <div class="note-list" id="noteList"></div>
          </nav>

          <footer class="sidebar__legal">
            © 2026 Miłosz Miśkiewicz. All rights reserved.
          </footer>
        </aside>

        <article class="note" id="noteView" aria-live="polite">
          <div class="note__inner">
            <p class="note__date" id="noteDate"></p>
            <div id="noteContent"></div>
          </div>
        </article>
      </div>

      <section
        class="gallery"
        id="galleryView"
        aria-label="Notes gallery"
        hidden
      >
        <p class="gallery__date" id="galleryDate"></p>
        <div class="gallery__grid" id="galleryGrid"></div>
        <p class="gallery__empty" id="galleryEmpty" hidden>
          No notes found.
        </p>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
